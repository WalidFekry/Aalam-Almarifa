apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    compileSdk 37
    defaultConfig {
        applicationId "com.walid.knowledgeworld"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 32
        versionName "4.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    namespace 'com.walid.knowledgeworld'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.github.mjn1369:prettydialog:1.0.4'
    implementation 'com.google.firebase:firebase-messaging:26.0.1'
    implementation 'com.google.firebase:firebase-analytics:24.0.0'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'com.github.code-mc:material-icon-lib:1.1.5'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'androidx.multidex:multidex:2.0.1'
}
